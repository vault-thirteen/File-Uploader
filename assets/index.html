<!DOCTYPE html><!-- HTML version 5 -->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="text/html; charset=utf-8" http-equiv=Content-Type>
    <title>File Uploader</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png"/>
    <link rel="stylesheet" href="styles.css">
	<script type="application/javascript" src="sha256.min.js"></script>
    <script type="application/javascript" src="scripts.js"></script>
</head>
<body>
    <div>
    <h1>File Upload</h1>
    <form name="fileUploadForm">
    <table class="form">
        <tr>
            <td>User Name</td>
            <td>
				<input type="text" name="username" class="full_width_element" />
			</td>
        </tr>
        <tr>
            <td>User Password</td>
            <td>
				<input type="password" name="userpwd" class="full_width_element" />
			</td>
        </tr>
		<tr>
			<td>Folder Path</td>
			<td>
				<input type="text" name="folderpath" class="full_width_element" />
			</td>
		</tr>
		<tr>
			<td>File Hash Sums (SHA-256)</td>
			<td>
				<input type="text" name="filehashes" class="full_width_element" readonly />
			</td>
		</tr>
		<tr id="file_row">
			<td>File</td>
			<td>
				<input type="file" name="files" class="full_width_element" onchange="onFileInputChange(this);" multiple />
			</td>
		</tr>
		<tr>
			<td colspan="2">
				<input type="button" value="UPLOAD" name="upload_btn" class="full_width_element" onClick="onUploadBtnClick();" />
			</td>
		</tr>
		<tr>
			<td>Status</td>
			<td>
				<div id="status"></div>
			</td>
		</tr>
		<tr>
			<td>Progress</td>
			<td>
				<div class="progressbar-container">
					<div id="progressbar" class="progressbar"></div>
				</div>
			</td>
		</tr>
		<tr>
			<td>Server Queue Size</td>
			<td>
				<div id="server_queue_size"></div>
			</td>
		</tr>
		<tr>
			<td>Server Response Time</td>
			<td>
				<div id="server_response_time"></div>
			</td>
		</tr>
    </table>
    </form>
</div>
</body>
</html>
